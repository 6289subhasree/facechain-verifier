[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facechain-verifier"
version = "0.1.0"
description = "Face matching, live public-web discovery, and Ethereum-backed evidence verification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.12,<1",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "web3[tester]>=7.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]
face = [
  "insightface>=0.7.3,<0.8",
  "onnxruntime>=1.19,<2",
  "opencv-python-headless>=4.10,<5",
]

[project.scripts]
facechain = "facechain.cli:app"
facechain-web = "facechain.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/facechain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
